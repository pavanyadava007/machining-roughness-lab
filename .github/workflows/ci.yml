name: ci
on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .
      - name: Gate (ruff + pytest on synthetic data, no dataset download)
        run: |
          ruff check .
          pytest -q
      - name: Example trial plans -> input decks
        run: |
          python -m mrl.siminput examples/grinding_plan.csv --out decks/grinding
          python -m mrl.siminput examples/turning_plan.csv --out decks/turning
