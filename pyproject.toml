[project]
name = "machining-roughness-lab"
version = "0.1.0"
description = "Surface roughness from 10 kHz force and vibration signals in Inconel-625 turning, with honest validation, trial-plan input decks and engineer-facing reports"
authors = [{ name = "Pavan Yadav Annappa", email = "pavanyadava07@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1", "scipy>=1.12", "scikit-learn>=1.4", "lightgbm>=4.3",
  "matplotlib>=3.8", "pyarrow>=15", "openpyxl>=3.1", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"src/mrl/report.py" = ["E501"]  # HTML page template

[tool.pytest.ini_options]
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]
testpaths = ["tests"]
pythonpath = ["src", "."]
